schema {
  query: query_root
}
type query_root {
  """
  List projects.
  """
  apps(where: apps_bool_exp, limit: Int = 10, status: app_status = ACTIVE, after: uuid): [apps!]!
}
type app_details {
  config: config
}
enum app_status {
  ACTIVE
  PAUSED
}
"""
A project managed through the Cloud API.
"""
type apps implements node {
  id: uuid!
  name: String!
  status: app_status!
  createdAt: timestamp!
  details: app_details
  config: config
}
input apps_bool_exp {
  _and: [apps_bool_exp!]
  _or: [apps_bool_exp!]
  _not: apps_bool_exp
  name: String
  status: app_status = ACTIVE
}
type config {
  enabled: Boolean!
  metadata: config_metadata
}
type config_metadata {
  region: String!
}
interface node {
  id: uuid!
}
type team implements node {
  id: uuid!
  title: String!
}
scalar timestamp
scalar uuid
