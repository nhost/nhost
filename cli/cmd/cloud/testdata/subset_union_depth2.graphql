schema {
  query: query_root
}
type query_root {
  search: [search_result!]!
}
enum app_status {
  ACTIVE
  PAUSED
}
"""
A project managed through the Cloud API.
"""
type apps implements node {
  id: uuid!
  name: String!
  status: app_status!
  createdAt: timestamp!
  details: app_details
  config: config
}
union search_result = apps | team
type team implements node {
  id: uuid!
  title: String!
}
scalar timestamp
scalar uuid
