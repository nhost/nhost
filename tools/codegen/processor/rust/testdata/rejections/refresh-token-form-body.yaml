openapi: 3.0.0
info:
  title: Invalid refresh token with a form body
  version: 1.0.0
paths:
  /token:
    post:
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      responses:
        "204":
          description: Refreshed
