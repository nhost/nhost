# Held-out documents for voice calibration, one entry per voice slug.
#
# A held-out document is chosen by a mechanical rule before its voice profile
# is written, then kept out of that profile's excerpts and out of voicestats,
# so the voice discrimination check scores text the profile never saw.
# calibration/README.md explains how each pick is made and how a veto works.
# tools/writing/internal/expect loads this file strictly: a key not listed
# here is an error.
#
# Top level:
#   model      the judge model the voice check is pinned to
#   voices     one entry per voice slug
#
# Per voice, exactly one of held_out and skip:
#   held_out     the held-out document, below
#   skip         true when the voice has no held-out document and the voice
#                check passes over it
#   record-only  true when the voice check scores and records the held-out
#                document but asserts nothing about it
#   reason       why the voice is skipped or record-only; required with
#                either, refused without
#   vetoed       every earlier pick that was rejected, in order, each with a
#                path and a reason; the next document in the same ordering
#                is then taken
#
# Per held_out block:
#   path       repo-relative path of the document
#   blob       `git rev-parse <chosen_at>:<path>`, 40 hex characters; a
#              document is live, so the voice check compares this against
#              the current blob before scoring and refuses one that has
#              changed
#   note       optional; why blob differs from the chosen_at blob, when a
#              deliberate edit re-recorded it
#   chosen_at  commit the rule was run at
#   rule       the selection rule, one line
#   reason     why this document is the pick

# model: not pinned yet. Phase 4b (the judge) pins this file and
# calibration/docs/native-queries/expect.yaml to the same value.

