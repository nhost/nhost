# Held-out documents for voice calibration, one entry per voice slug.
#
# A held-out document is chosen by a mechanical rule before its voice profile
# is written, then kept out of that profile's excerpts and out of voicestats,
# so the voice discrimination check scores text the profile never saw.
# calibration/README.md explains how each pick is made and how a veto works.
#
# Phase 5 of the writing quality plan adds to this file:
#   - voices.nuno-pato and voices.david-barroso, each with a held_out block;
#   - voices.max-serdiukov with `skip: true` and a reason (one post, no
#     held-out);
#   - voices.nhost-blog with a held_out block, `record-only: true` and a reason
#     (the house corpus averages the profiled authors' posts);
#   - a top-level `model:` pin for the judge, equal to the docs pair's.
#
# Per held_out block:
#   path       repo-relative path of the document
#   blob       `git rev-parse <chosen_at>:<path>`; a docs page is live, so the
#              voice check compares this against the current blob before
#              scoring and refuses a page that has changed
#   chosen_at  commit the rule was run at
#   rule       the selection rule, one line
#   reason     why this document is the pick
# vetoed lists every earlier pick that was rejected, in order, each with a
# path and a reason; the next document in the same ordering is then taken.

voices:
  nhost-docs:
    held_out:
      path: docs/src/content/docs/platform/cloud/environment-variables.mdx
      blob: 593a2ef202fbc62229a141d6f4c2fa0b8c43dcb0
      chosen_at: 79bfe1016b
      rule: >-
        Latest last-commit date (git log -1 --format=%ct at chosen_at) among
        docs/src/content/docs pages, excluding generated pages,
        products/database/native-queries.mdx and
        products/auth/sign-in-magic-link.mdx; ties broken by ascending path.
      reason: >-
        First in the ordering. Tied on fe29c592bd, an XSS fix to the
        functions example that touched both this page and
        products/functions/guides/getting-started.mdx; ascending path breaks
        the tie.
    vetoed: []
