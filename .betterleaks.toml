[extend]
useDefault = true

# - The helpers below find project details in the same diff chunk.
# - We try those projects, plus prod and staging. CI only fails if a secret works.
[[rules]]
id = "nhost-hasura-admin-secret"
description = "Nhost Hasura admin secret"
keywords = ["adminsecret", "admin_secret", "admin-secret"]
regex = '''(?im)(?:^|[^a-z0-9_-])(?:(?:(?:[a-z0-9]+_)*(?:nhost(?:_[a-z0-9]+)*|hasura(?:_graphql)?|constellation)_admin_secret(?:_[a-z0-9]+)*|x-hasura-admin-secret|admin[_-]?secret)["']?[ \t]*(?::=|=|:)[ \t]*|--admin-secret(?:[ \t]*=[ \t]*|[ \t]+))(?:"(?P<double_quoted>(?:\\.|[^"\\\r\n])+)"|'([^'\r\n]+)'|([^\s"'`$&*=<>;,{}()\[\]\\][^\s"'`;,{}()\[\]\\]*))'''
confidence = "high"
components = [
  { id = "nhost-project-url", optional = true },
  { id = "nhost-project-subdomain", optional = true },
  { id = "nhost-project-region", optional = true },
]
filter = '''
let bare = !filter.matchesAny(finding["match"], [`["']$`]);
let code = filter.matchesAny(attributes["path"] ?? "", [
  `(?i)\.(?:[cm]?[jt]sx?|go|rs|py|swift|cue|graphql|gql)$`,
]);
let before = finding["fragment_raw"][finding["match_line_start_idx"]:finding["match_start_idx"]];
let after = finding["fragment_raw"][finding["match_end_idx"]:finding["match_line_end_idx"]];
let embedded = filter.matchesAny(finding["match"], [
  `^["'\x60][^"'\x60]*(?:=|:)[ \t]*[^"'\x60]*$`,
]) || (
  filter.matchesAny(finding["match"], [`--admin-secret(?:[ \t=])`]) &&
  filter.matchesAny(before + finding["match"], [`["'\x60]`])
);
let prose = filter.matchesAny(attributes["path"] ?? "", [`(?i)\.mdx?$`]) &&
filter.matchesAny(finding["match"], [`(?i)(?:^|[^a-z0-9_-])admin[_-]?secret["']?[ \t]*(?:=|:)`]) && (
  !filter.matchesAny(before, [`^[ \t]*(?:(?:#|//|[-*])[ \t]*)?$`]) ||
  filter.matchesAny(after, [`^[ \t]+[A-Za-z]`]) ||
  filter.matchesAny(finding["match"], [`(?i)admin[_-]?secret[ \t]*:[ \t]*(?:string|str)[!?]?$`])
);
(bare && (code || prose) && !embedded) ||
(finding["match"] startsWith "{" && before endsWith "$") ||
filter.matchesAny(finding["secret"], [
  `\$\{|\{\{`,
  `^\$[A-Za-z_][A-Za-z0-9_]*$`,
  `^<[^>]*>?$`,
  `^__[A-Z][A-Z0-9_]*__$`,
  `^%[+#0 -]?[0-9]*(?:\.[0-9]+)?[sqv]$`,
  `^(?:process\.env\b|os\.(?:Getenv|LookupEnv)\b)`,
])
'''
validate = '''
let doubleQuoted = finding["captures"]?.double_quoted ?? "";
let adminSecret = doubleQuoted != ""
  ? fromJSON("\"" + doubleQuoted + "\"")
  : finding["secret"];
let projectURL = components["nhost-project-url"]?.captures;
let subdomain = components["nhost-project-subdomain"]?.secret ?? "";
let region = components["nhost-project-region"]?.secret ?? "";
let targets = uniq([
  projectURL != nil
    ? "https://" + projectURL.subdomain + ".hasura." + projectURL.region + ".nhost.run/v1/metadata"
    : "",
  subdomain != "" && region != ""
    ? "https://" + subdomain + ".hasura." + region + ".nhost.run/v1/metadata"
    : "",
  "https://otsispdzcwxyqzbfntmj.hasura.eu-central-1.nhost.run/v1/metadata",
  "https://mytpiiwxeyrvlqrxuknp.hasura.eu-central-1.nhost.run/v1/metadata",
]);
let matched = find(targets, {
  # != "" && (
    let response = http.post(
      #,
      {
        "Content-Type": "application/json",
        "X-Hasura-Admin-Secret": adminSecret
      },
      "{\"type\":\"get_inconsistent_metadata\",\"args\":{}}"
    );
    response.status == 200 && response.json?.is_consistent in [true, false]
  )
});
matched != nil ? {
  "result": "valid",
  "endpoint": matched
} : {
  "result": "unknown",
  "reason": "Not confirmed against discovered or configured Nhost projects"
}
'''





# Helpers to find Nhost project details in the same diff chunk.
# =============================================================

[[rules]]
id = "nhost-project-url"
description = "Nhost project service URL"
keywords = ["nhost.run"]
regex = '''(?i)https://(?P<subdomain>(?-i:[a-z]{20}))\.(?:hasura|graphql|auth|storage|functions)\.(?P<region>(?-i:[a-z]{2}-[a-z]+-[1-9][0-9]*(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*))\.nhost\.run(?:[/?#\s"'`),;}\]]|$)'''
skipReport = true

[[rules]]
id = "nhost-project-subdomain"
description = "Nhost project subdomain"
keywords = ["subdomain"]
regex = '''(?im)(?:^|[^a-z0-9_])(?:(?:[a-z0-9]+_)*nhost(?:_[a-z0-9]+)*_subdomain(?:_[a-z0-9]+)*|subdomain)["']?[ \t]*(?:=|:)[ \t]*(?-i:(?:"([a-z]{20})"|'([a-z]{20})'|([a-z]{20})))(?:[\s,;\]}]|$)'''
skipReport = true
filter = '''finding["secret"] == "local"'''

[[rules]]
id = "nhost-project-region"
description = "Nhost project region"
keywords = ["region"]
regex = '''(?im)(?:^|[^a-z0-9_])(?:(?:[a-z0-9]+_)*nhost(?:_[a-z0-9]+)*_region(?:_[a-z0-9]+)*|region)["']?[ \t]*(?:=|:)[ \t]*(?-i:(?:"([a-z]{2}-[a-z]+-[1-9][0-9]*(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*)"|'([a-z]{2}-[a-z]+-[1-9][0-9]*(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*)'|([a-z]{2}-[a-z]+-[1-9][0-9]*(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*)))(?:[\s,;\]}]|$)'''
skipReport = true
filter = '''finding["secret"] == "local"'''
