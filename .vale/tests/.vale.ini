# Config for .vale/test.sh. It parses fixtures exactly like docs/.vale.ini
# parses pages: same format mapping, vocabulary and TokenIgnores (copied
# verbatim, keep the two in step), with only the Nhost style enabled.
StylesPath = ../styles

Vocab = Nhost

[formats]
mdx = md

[*.{md,mdx}]
TokenIgnores = (?m)^(import\s[^\n]*?['"][^'"\n]+['"];?)$, \
  (?sm)^(export const \w+) = \{\n(?:[ \t]+[^\n]*\n|\n)*\};?$, \
  (\{/\*)(?s:.*?)\*/\}, \
  (</?[A-Z][\w.]*)(?:\s[^<>]*)?/?>
BasedOnStyles = Nhost
