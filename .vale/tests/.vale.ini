# Config for .vale/test.sh. It parses fixtures exactly like docs/.vale.ini and
# landing/.vale.ini parse pages: same format mapping, vocabulary and
# TokenIgnores (copied verbatim, keep the three in step), with the house
# styles enabled and the built-in Vale.* checks left off.
StylesPath = ../styles

Vocab = Nhost

[formats]
mdx = md

[*.{md,mdx}]
TokenIgnores = (?m)^(import\s[^\n]*?['"][^'"\n]+['"];?)$, \
  (?sm)^(export const \w+) = \{\n(?:[ \t]+[^\n]*\n|\n)*\};?$, \
  (\{/\*)(?s:.*?)\*/\}, \
  (</?[A-Z][\w.]*)(?:\s[^<>]*)?/?>

# One style per fixture tree, because the two disagree on purpose: a docs page
# uses ':::' callouts and app.nhost.io deep links, which NhostBlog.Callout and
# NhostBlog.NewTabRel are written to reject. Running both over both trees would
# make each style's fixtures fail the other's rules.
[.vale/tests/NhostBlog/**/*.{md,mdx}]
BasedOnStyles = NhostBlog

[.vale/tests/Nhost/**/*.{md,mdx}]
BasedOnStyles = Nhost
