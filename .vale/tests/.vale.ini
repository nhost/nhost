# Config for .vale/test.sh. Same TokenIgnores as docs/.vale.ini; keep in step.
StylesPath = ../styles

Vocab = Nhost

[formats]
mdx = md

[*.{md,mdx}]
TokenIgnores = (?m)^(import\s[^\n]*?['"][^'"\n]+['"];?)$, \
  (?sm)^(export const \w+) = \{\n(?:[ \t]+[^\n]*\n|\n)*\};?$, \
  (\{/\*)(?s:.*?)\*/\}, \
  (</?[A-Z][\w.]*)(?:\s[^<>]*)?/?>

# One style per fixture tree; each style's fixtures trip the other's rules.
[.vale/tests/NhostBlog/**/*.{md,mdx}]
BasedOnStyles = NhostBlog

[.vale/tests/Nhost/**/*.{md,mdx}]
BasedOnStyles = Nhost
