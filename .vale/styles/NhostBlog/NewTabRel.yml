# Raw scope: TokenIgnores drop tags. Unlike Nhost.DeepLinkRel, covers any
# new-tab link. rel may hold both tokens in any order with extras such as
# nofollow; either quote style for rel and target.
extends: existence
message: "A link that opens a new tab needs
  'rel=\"noopener noreferrer\"'."
level: error
scope: raw
# accept.txt terms would otherwise hide a match.
vocab: false
nonword: true
tokens:
  - '<a\s(?![^<>]*\brel=["''](?=[^"''<>]*\bnoopener\b)(?=[^"''<>]*\bnoreferrer\b))(?=[^<>]*\btarget=["'']_blank["''])[^<>]*>'
