# NhostBlog rule. Raw scope, so a host inside a code fence or a JSX href is
# seen too. Scoped to hosts we serve, because a third party's scheme is not
# ours to fix; every nhost.io host redirects to https, so a plain-http link
# only costs the reader a hop. 'http://localhost' does not match: the token
# needs a literal 'nhost.io' after the scheme.
extends: existence
message: "BLOG-06: '%s' redirects; link Nhost hosts over https."
level: warning
scope: raw
# Accepted vocabulary terms (Nhost) would otherwise hide a match.
vocab: false
nonword: true
tokens:
  - 'http://[a-z0-9.-]*nhost\.io'
