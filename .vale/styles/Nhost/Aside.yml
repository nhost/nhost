# Nhost rule. Raw scope, because the TokenIgnores in .vale.ini drop JSX tags.
extends: existence
message: "Use a ':::note', ':::tip' or ':::caution' callout,
  never the '%s' component."
level: error
scope: raw
# Accepted vocabulary terms (Hasura, GraphQL) would otherwise hide a match.
vocab: false
nonword: true
tokens:
  - '<Aside\b'
