# Raw scope, to see URLs in code fences and JSX.
extends: existence
message: "Give the UI path and a deep link through
  'app.nhost.io/orgs/_/projects/_/', not '%s'."
level: error
scope: raw
# accept.txt terms would otherwise hide a match.
vocab: false
nonword: true
tokens:
  # A dashboard URL template such as /orgs/{org}/projects/{project}/...
  - '/orgs/\{[^}\s/]+\}/projects/'
  # A dashboard link naming an organisation instead of the '_' placeholder.
  - 'app\.nhost\.io/orgs/[^_\s"/][^\s"/]*'
