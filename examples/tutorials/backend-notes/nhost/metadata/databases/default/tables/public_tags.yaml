table:
  name: tags
  schema: public
array_relationships:
  - name: noteTags
    using:
      foreign_key_constraint_on:
        column: tag_id
        table:
          name: note_tags
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        user_id: X-Hasura-User-Id
      columns:
        - name
        - color
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - color
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - color
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
