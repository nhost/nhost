table:
  name: note_attachments
  schema: public
object_relationships:
  - name: note
    using:
      foreign_key_constraint_on: note_id
  - name: file
    using:
      foreign_key_constraint_on: file_id
insert_permissions:
  - role: user
    permission:
      check:
        note:
          user_id:
            _eq: X-Hasura-User-Id
      columns:
        - note_id
        - file_id
select_permissions:
  - role: user
    permission:
      columns:
        - note_id
        - file_id
      filter:
        note:
          user_id:
            _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        note:
          user_id:
            _eq: X-Hasura-User-Id
