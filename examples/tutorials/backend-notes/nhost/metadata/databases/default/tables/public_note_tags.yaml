table:
  name: note_tags
  schema: public
object_relationships:
  - name: note
    using:
      foreign_key_constraint_on: note_id
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
insert_permissions:
  - role: user
    permission:
      # No user_id column here; ownership is inherited from the parent note.
      check:
        note:
          user_id:
            _eq: X-Hasura-User-Id
      columns:
        - note_id
        - tag_id
select_permissions:
  - role: user
    permission:
      columns:
        - note_id
        - tag_id
      filter:
        note:
          user_id:
            _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        note:
          user_id:
            _eq: X-Hasura-User-Id
