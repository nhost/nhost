; Mirrors [tool.mypy] in packages/nhost-python/pyproject.toml, which used to
; apply to this example when it lived inside that package.
;
; The pydantic plugin is required, not cosmetic: the SDK's request models set
; populate_by_name=True, so field names are valid alongside their wire aliases.
; Without the plugin mypy synthesizes an __init__ that accepts only the aliases
; and reports false positives.
[mypy]
python_version = 3.11
strict = True
plugins = pydantic.mypy
