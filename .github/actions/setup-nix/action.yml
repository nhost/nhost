name: "Setup Nix"
description: "Install Nix and setup caching for Nhost projects"
inputs:
  NAME:
    description: "Project name for cache key"
    required: true
  NIX_CACHE_PUB_KEY:
    description: "Nix cache public key"
    required: true
  GITHUB_TOKEN:
    description: "GitHub token for Nix access"
    required: true
  NIX_CACHE_ACCESS_KEY_ID:
    description: "R2 access key id for reading the Nix cache"
    required: true
  NIX_CACHE_SECRET_ACCESS_KEY:
    description: "R2 secret access key for reading the Nix cache"
    required: true
  CACHE_TARGET:
    description: "Cached flake installable; {system} expands to the native system"
    default: ".#packages.{system}.nixops"
  SKIP_CACHE_CHECK:
    description: "Skip the ready-cache gate when bootstrapping or refreshing it"
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        install_url: "https://releases.nixos.org/nix/nix-2.28.5/install"
        extra_nix_config: |
          download-buffer-size = 500000000
          experimental-features = nix-command flakes
          sandbox = relaxed
          access-tokens = github.com=${{ inputs.GITHUB_TOKEN }}
          substituters = https://cache.nixos.org/?priority=40 s3://nhost-nix-cache?endpoint=https://14bc02755b64adb7c8c62b5420d0a457.eu.r2.cloudflarestorage.com&region=auto&priority=10
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{ inputs.NIX_CACHE_PUB_KEY }}
          keep-env-derivations = true
          keep-outputs = true
          accept-flake-config = true
          # Build from source when a substitute fails (e.g. a corrupt narinfo
          # upstream) instead of aborting the job. See nixops/project.nix where
          # geos is cached: this lets the first build past a bad cache.nixos.org
          # entry and into our R2 cache, after which the priority=10 nhost
          # substituter serves it.
          fallback = true

    - name: "Forward R2 credentials to the Nix daemon"
      # NixOS runners already have Nix, so the installer skips extra_nix_config.
      # Configure both the hosted runner's default profile and the named profile
      # used by NixOS and flake.nix, then reset daemon credential state.
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.NIX_CACHE_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.NIX_CACHE_SECRET_ACCESS_KEY }}
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          root_home=/var/root
        else
          root_home=/root
        fi
        sudo mkdir -p "$root_home/.aws"
        sudo tee "$root_home/.aws/credentials" > /dev/null <<EOF
        [default]
        aws_access_key_id = $AWS_ACCESS_KEY_ID
        aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
        region = auto
        [nhost-nix-cache]
        aws_access_key_id = $AWS_ACCESS_KEY_ID
        aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
        region = auto
        EOF
        sudo chmod 600 "$root_home/.aws/credentials"

        if [ "$RUNNER_OS" = "macOS" ]; then
          sudo launchctl kickstart -k system/org.nixos.nix-daemon
        else
          sudo systemctl restart nix-daemon
        fi

    - name: Initialize Nix cache roots
      shell: bash
      run: |
        roots="$RUNNER_TEMP/nix-cache-roots"
        # Include locked inputs, not the per-commit source of this repository.
        nix flake archive --json --dry-run |
          jq -r '.inputs | .. | .path? // empty' > "$roots"
        echo "NIX_CACHE_ROOTS=$roots" >> "$GITHUB_ENV"

    - name: "Verify shared tools are cached"
      if: ${{ inputs.NAME != 'nixops' && inputs.SKIP_CACHE_CHECK != 'true' }}
      shell: bash
      env:
        CACHE_TARGET: ${{ inputs.CACHE_TARGET }}
      run: |
        ARCH=$([ "$(uname -m)" = "x86_64" ] && echo "x86_64" || echo "aarch64")
        SYSTEM=$([ "$RUNNER_OS" = "macOS" ] && echo "$ARCH-darwin" || echo "$ARCH-linux")
        target=${CACHE_TARGET//\{system\}/$SYSTEM}
        log=$(mktemp)
        trap 'rm -f "$log"' EXIT
        if ! nix build --dry-run "$target" > "$log" 2>&1; then
          cat "$log" >&2
          echo "::error::failed to evaluate cache target $target"
          exit 1
        fi
        if grep -q "will be built" "$log"; then
          cat "$log"
          echo "::error::cache target $target needs to be built and cached first"
          exit 1
        fi
