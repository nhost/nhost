---
name: 'Cache Nix to R2'
description: 'Copy workflow-related Nix outputs and locked inputs to R2'
inputs:
  ROOTS_FILE:
    description: 'File of derivation paths and explicit locked source paths'
    required: true
  NIX_CACHE_PRIV_KEY:
    description: 'Nix cache private key'
    required: true
  NIX_CACHE_ACCESS_KEY_ID:
    description: 'R2 access key id for writing to the Nix cache'
    required: true
  NIX_CACHE_SECRET_ACCESS_KEY:
    description: 'R2 secret access key for writing to the Nix cache'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Cache workflow outputs
      shell: bash
      env:
        ROOTS_FILE: ${{ inputs.ROOTS_FILE }}
        NIX_CACHE_PRIV_KEY: ${{ inputs.NIX_CACHE_PRIV_KEY }}
        AWS_ACCESS_KEY_ID: ${{ inputs.NIX_CACHE_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.NIX_CACHE_SECRET_ACCESS_KEY }}
        CACHE_SCRIPT: ${{ github.action_path }}/cache.sh
      run: bash "$CACHE_SCRIPT"
