---
name: "templates: check and build"
on:
  pull_request:
    paths:
      - ".github/workflows/templates_checks.yaml"
      - "templates/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - nextjs-shadcn
          - tanstack-shadcn
    defaults:
      run:
        working-directory: templates/${{ matrix.template }}/frontend
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/${{ matrix.template }}/frontend/pnpm-lock.yaml

      # --ignore-workspace: the template is standalone, not a monorepo member.
      - run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Verify generated GraphQL types
        run: |
          pnpm codegen:types
          test -z "$(git status --porcelain -- src/gql)"

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # Catches a committed route tree or generated document that no longer
      # matches the sources it is generated from.
      - name: Verify committed generated sources are current
        run: test -z "$(git status --porcelain -- src)"
