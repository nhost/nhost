---
name: "templates: check and build"
on:
  pull_request:
    paths:
      - ".github/workflows/templates_checks.yaml"
      - "templates/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nextjs-shadcn:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/nextjs-shadcn/frontend
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/nextjs-shadcn/frontend/pnpm-lock.yaml

      # --ignore-workspace: the template is standalone, not a monorepo member.
      - run: pnpm install --frozen-lockfile --ignore-workspace

      - run: pnpm lint

      - run: pnpm build
