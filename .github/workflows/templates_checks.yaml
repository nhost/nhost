---
name: "templates: check and build"
on:
  pull_request:
    paths:
      - ".github/workflows/templates_checks.yaml"
      - "templates/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nextjs-shadcn:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/nextjs-shadcn/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/nextjs-shadcn/frontend/pnpm-lock.yaml

      # The template ships its own pnpm-workspace.yaml, so pnpm treats it as a
      # standalone workspace root instead of a member of the monorepo.
      - run: pnpm install --frozen-lockfile

      - name: Verify generated GraphQL types
        run: |
          pnpm codegen:types
          test -z "$(git status --porcelain -- src/gql)"

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  react:
