---
name: "templates: check and build"
on:
  pull_request:
    paths:
      - ".github/workflows/templates_checks.yaml"
      - "templates/**"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event_name, 'pull_request') && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') }}

jobs:
  nextjs-shadcn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: templates/nextjs-shadcn/frontend
    steps:
      - uses: actions/checkout@v7

      # No `version:` input: the action resolves pnpm from the monorepo root
      # `packageManager` field, and errors out if the two ever disagree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/nextjs-shadcn/frontend/pnpm-lock.yaml

      # The template ships its own pnpm-workspace.yaml, so pnpm treats it as a
      # standalone workspace root instead of a member of the monorepo.
      - run: pnpm install --frozen-lockfile

      - name: Verify generated GraphQL types
        run: |
          pnpm codegen:types
          if [ -n "$(git status --porcelain -- src/gql)" ]; then
            echo "::error::Generated GraphQL types are out of date."
            echo "Fix: pnpm codegen:types && git add src/gql"
            git status --porcelain -- src/gql
            git --no-pager diff -- src/gql
            exit 1
          fi

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/react/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/react/frontend/pnpm-lock.yaml

      # The template ships its own pnpm-workspace.yaml, so pnpm treats it as a
      # standalone workspace root instead of a member of the monorepo.
      - run: pnpm install --frozen-lockfile

      - name: Verify generated GraphQL types
        run: |
          pnpm codegen:types
          test -z "$(git status --porcelain -- src/gql)"

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  vue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/vue/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/vue/frontend/pnpm-lock.yaml

      # The template ships its own pnpm-workspace.yaml, so pnpm treats it as a
      # standalone workspace root instead of a member of the monorepo.
      - run: pnpm install --frozen-lockfile

      - name: Verify generated GraphQL types
        run: |
          pnpm codegen:types
          test -z "$(git status --porcelain -- src/gql)"

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/react-native/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/react-native/frontend/pnpm-lock.yaml

      # The template ships its own pnpm-workspace.yaml, so pnpm treats it as a
      # standalone workspace root instead of a member of the monorepo.
      - run: pnpm install --frozen-lockfile

      - name: Verify generated GraphQL types
        run: |
          pnpm codegen:types
          test -z "$(git status --porcelain -- src/gql)"

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

  # Cross-template, and deliberately without a `working-directory` default:
  # the guard walks every `templates/*/` from the repository root.
  agent-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the duplicated agent-context files for drift
        run: ./templates/check-agent-context.sh
