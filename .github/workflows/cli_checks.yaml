---
name: "cli: check and build"
on:
  # TEMP(revert-before-merge): swapped pull_request_target -> pull_request so the
  # PR head's cli_wf_e2e.yaml + test_e2e job actually execute. pull_request_target
  # would run the base branch's workflow, where the e2e leg doesn't exist yet.
  # Restore pull_request_target before merging.
  pull_request:
    paths:
      - ".github/workflows/cli_checks.yaml"
      - ".github/workflows/wf_check.yaml"
      - ".github/workflows/wf_build_artifacts.yaml"
      - ".github/workflows/cli_wf_test_new_project.yaml"
      - ".github/workflows/cli_wf_e2e.yaml"

      # common build
      - "flake.nix"
      - "flake.lock"
      - "nixops/**"
      - "build/**"

      # common go
      - ".golangci.yaml"
      - "govulncheck.yaml"
      - "go.mod"
      - "go.sum"
      - "vendor/**"

      # cli
      - "cli/**"

      # lib
      - "internal/lib/**"

      # bundled engine: the engine-mode e2e leg compiles the engine, its three
      # services, and their additional shared libraries. Intentionally running
      # the full CLI checks for auth/storage changes keeps mode equivalence
      # tested; constellation is also imported by `nhost schema`.
      - "services/engine/**"
      - "services/auth/**"
      - "services/storage/**"
      - "services/constellation/**"

      # auth email templates (embedded into the CLI by `nhost init`)
      - "services/auth/email-templates/**"

      # docs
      - "docs/**"
  merge_group:

concurrency:
  # TEMP(revert-before-merge): include event_name so this pull_request run does not
  # share a concurrency group with the base branch's pull_request_target run (which
  # still fires) and get mutually cancelled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ startsWith(github.event_name, 'pull_request') && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') }}

jobs:
  detect-changes:
    uses: ./.github/workflows/wf_detect_changes.yaml
    with:
      patterns: |
        .github/workflows/cli_checks.yaml
        .github/workflows/wf_check.yaml
        .github/workflows/wf_build_artifacts.yaml
        .github/workflows/cli_wf_test_new_project.yaml
        .github/workflows/cli_wf_e2e.yaml
        flake.nix
        flake.lock
        nixops/**
        build/**
        .golangci.yaml
        govulncheck.yaml
        go.mod
        go.sum
        vendor/**
        cli/**
        internal/lib/**
        services/engine/**
        services/auth/**
        services/storage/**
        services/constellation/**
        services/auth/email-templates/**
        docs/**

  check-permissions:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check-permissions

  tests:
    uses: ./.github/workflows/wf_check.yaml
    needs:
      - detect-changes
      - check-permissions
    if: needs.detect-changes.outputs.should_run == 'true'
    with:
      NAME: cli
      PATH: cli
      GIT_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_PRODUCTION_CORE_ACCOUNT_ID }}
      NIX_CACHE_PUB_KEY: ${{ secrets.NIX_CACHE_PUB_KEY }}
      NIX_CACHE_PRIV_KEY: ${{ secrets.NIX_CACHE_PRIV_KEY }}
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
      NHOST_PAT: ${{ secrets.NHOST_PAT }}

  build_artifacts:
    uses: ./.github/workflows/wf_build_artifacts.yaml
    needs:
      - detect-changes
      - check-permissions
    if: needs.detect-changes.outputs.should_run == 'true'
    with:
      NAME: cli
      PATH: cli
      GIT_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      VERSION: 0.0.0-dev # we use a fixed version here to avoid unnecessary rebuilds
      DOCKER: true
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_PRODUCTION_CORE_ACCOUNT_ID }}
      NIX_CACHE_PUB_KEY: ${{ secrets.NIX_CACHE_PUB_KEY }}
      NIX_CACHE_PRIV_KEY: ${{ secrets.NIX_CACHE_PRIV_KEY }}
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}

  build_engine_image:
    uses: ./.github/workflows/wf_build_artifacts.yaml
    needs:
      - detect-changes
      - check-permissions
    # Skipped on `release/dashboard` PRs because the release PR bumps the
    # `nhost/dashboard:<tag>` ref in `cli/cmd/dev/` to a version that isn't
    # published until the PR merges, which makes `cli up` fail to pull it.
    # `test_e2e` needs this job, so this guard also skips that suite on those PRs.
    # `github.head_ref` is empty on `merge_group`, so that event still runs.
    if: |
      needs.detect-changes.outputs.should_run == 'true' &&
      !startsWith(github.head_ref, 'release/dashboard')
    with:
      NAME: engine
      PATH: services/engine
      GIT_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      VERSION: 0.0.0-dev # keep in sync with E2E_ENGINE_VERSION
      DOCKER: true
      OS_MATRIX: '["blacksmith-2vcpu-ubuntu-2404"]'
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_PRODUCTION_CORE_ACCOUNT_ID }}
      NIX_CACHE_PUB_KEY: ${{ secrets.NIX_CACHE_PUB_KEY }}
      NIX_CACHE_PRIV_KEY: ${{ secrets.NIX_CACHE_PRIV_KEY }}
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}

  test_cli_build:
    uses: ./.github/workflows/cli_wf_test_new_project.yaml
    needs:
      - detect-changes
      - check-permissions
      - build_artifacts
    if: needs.detect-changes.outputs.should_run == 'true'
    with:
      NAME: cli
      PATH: cli
      GIT_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_PRODUCTION_CORE_ACCOUNT_ID }}
      NIX_CACHE_PUB_KEY: ${{ secrets.NIX_CACHE_PUB_KEY }}
      NIX_CACHE_PRIV_KEY: ${{ secrets.NIX_CACHE_PRIV_KEY }}
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
      NHOST_PAT: ${{ secrets.NHOST_PAT }}

  test_e2e:
    uses: ./.github/workflows/cli_wf_e2e.yaml
    needs:
      - detect-changes
      - check-permissions
      - build_artifacts
      - build_engine_image
    if: needs.detect-changes.outputs.should_run == 'true'
    with:
      GIT_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_PRODUCTION_CORE_ACCOUNT_ID }}
      NIX_CACHE_PUB_KEY: ${{ secrets.NIX_CACHE_PUB_KEY }}
      NIX_CACHE_PRIV_KEY: ${{ secrets.NIX_CACHE_PRIV_KEY }}
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}

  remove_label:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - check-permissions
    if: |
      needs.detect-changes.outputs.should_run == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'safe_to_test')
    steps:
      - uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: |
            safe_to_test
