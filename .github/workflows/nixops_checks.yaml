---
name: "nixops: check and build"
on:
  pull_request_target:
    paths:
      - ".github/workflows/wf_check.yaml"
      - ".github/workflows/nixops_checks.yaml"

      # common build
      - "flake.nix"
      - "flake.lock"
      - "nixops/**"
      - "build/**"

      # the pinned-toolchains check in checks.nixops scans every .nix file
      # in the repo, so run it whenever any of them changes
      - "**.nix"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event_name, 'pull_request') && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') }}

jobs:
  detect-changes:
    uses: ./.github/workflows/wf_detect_changes.yaml
    with:
      patterns: |
        .github/workflows/wf_check.yaml
        .github/workflows/nixops_checks.yaml
        flake.nix
        flake.lock
        nixops/**
        build/**
        **.nix

  check-permissions:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check-permissions

  eval:
    needs: [detect-changes, check-permissions]
    if: needs.detect-changes.outputs.should_run == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true

      - name: Setup Nix with Cache
        uses: ./.github/actions/setup-nix
        with:
          NAME: nixops
          NIX_CACHE_PUB_KEY: ${{ secrets.NIX_CACHE_PUB_KEY }}
          NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
          NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Evaluate nixops-docker-image (no build)"
        # Forcing the derivation's `.drvPath` instantiates the full build
        # graph, which fires any eval-time `throw` (removed/renamed attrs,
        # failed assertions, type errors) without building or fetching. This
        # does NOT catch build-time failures (broken patches, failing tests,
        # hash mismatches) — those still need a real build.
        run: |
          nix eval --raw \
            .#packages.x86_64-linux.nixops-docker-image.drvPath

  tests:
    uses: ./.github/workflows/wf_check.yaml
    needs:
      - detect-changes
      - check-permissions
    if: needs.detect-changes.outputs.should_run == 'true'
    with:
      NAME: nixops
      PATH: nixops
      GIT_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_PRODUCTION_CORE_ACCOUNT_ID }}
      NIX_CACHE_PUB_KEY: ${{ secrets.NIX_CACHE_PUB_KEY }}
      NIX_CACHE_PRIV_KEY: ${{ secrets.NIX_CACHE_PRIV_KEY }}
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}

  build_artifacts:
    uses: ./.github/workflows/wf_build_artifacts.yaml
    needs:
      - detect-changes
      - check-permissions
    if: needs.detect-changes.outputs.should_run == 'true'
    with:
      NAME: nixops
      PATH: nixops
      GIT_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      VERSION: 0.0.0-dev # we use a fixed version here to avoid unnecessary rebuilds
      DOCKER: false
      OS_MATRIX: '["blacksmith-32vcpu-ubuntu-2404-arm", "blacksmith-8vcpu-ubuntu-2404", "blacksmith-6vcpu-macos-latest"]'
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_PRODUCTION_CORE_ACCOUNT_ID }}
      NIX_CACHE_PUB_KEY: ${{ secrets.NIX_CACHE_PUB_KEY }}
      NIX_CACHE_PRIV_KEY: ${{ secrets.NIX_CACHE_PRIV_KEY }}
      NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
      NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}

  remove_label:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - check-permissions
    if: |
      needs.detect-changes.outputs.should_run == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'safe_to_test')
    steps:
      - uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: |
            safe_to_test
