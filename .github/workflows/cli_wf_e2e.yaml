---
# Functional end-to-end tests for the CLI-managed local development
# environment. The same black-box suite (cli/e2e) runs against both topologies:
# the standalone auth/storage/graphql containers, and the bundled engine
# (experimental.nhost). Running identical assertions in both is what makes the
# engine's equivalence to the standalone services a tested claim.
on:
  workflow_call:
    inputs:
      GIT_REF:
        type: string
        required: false
    secrets:
      AWS_ACCOUNT_ID:
        required: true
      NIX_CACHE_PUB_KEY:
        required: true
      NIX_CACHE_PRIV_KEY:
        required: true
      NIX_CACHE_ACCESS_KEY_ID:
        required: true
      NIX_CACHE_SECRET_ACCESS_KEY:
        required: true

jobs:
  e2e:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Allow the 30m Go deadline plus 10m for Nix setup, artifact downloads,
    # image loads, test-binary compilation, and cache storage. The aggregate
    # gate's 45m starts with the check set, includes the upstream engine build,
    # and needs a 2m settle window; this local cap does not widen that window.
    # The build's always-run cache store can make a retry warm after a cold build.
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        # standalone = individual auth/storage/graphql containers.
        # engine     = one nhost/engine container serving all three.
        mode: [standalone, engine]

    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.GIT_REF }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Configure aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-nhost-${{ github.event.repository.name }}
          aws-region: eu-central-1

      - name: Setup Nix with Cache
        uses: ./.github/actions/setup-nix
        with:
          NAME: cli
          NIX_CACHE_PUB_KEY: ${{ secrets.NIX_CACHE_PUB_KEY }}
          NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
          NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Get artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*-linux-x86_64-0.0.0-dev
          path: ~/artifacts

      - name: "Load CLI image (configserver)"
        run: |
          skopeo copy --insecure-policy \
            "dir:$HOME/artifacts/cli-docker-image-linux-x86_64-0.0.0-dev" \
            docker-daemon:cli:0.0.0-dev

      - name: "Unpack CLI binary"
        run: |
          mkdir -p "$RUNNER_TEMP/clibin"
          unzip -o "$HOME/artifacts/cli-artifact-linux-x86_64-0.0.0-dev/result.zip" -d "$RUNNER_TEMP/clibin"

      - name: "Get engine image"
        if: ${{ matrix.mode == 'engine' }}
        uses: actions/download-artifact@v8
        with:
          name: engine-docker-image-linux-x86_64-0.0.0-dev
          path: ~/artifacts/engine-docker-image-linux-x86_64-0.0.0-dev

      - name: "Load engine image"
        if: ${{ matrix.mode == 'engine' }}
        run: |
          skopeo copy --insecure-policy \
            "dir:$HOME/artifacts/engine-docker-image-linux-x86_64-0.0.0-dev" \
            docker-daemon:nhost/engine:0.0.0-dev

      - name: "Run e2e suite (${{ matrix.mode }})"
        env:
          E2E_MODE: ${{ matrix.mode }}
          E2E_CONFIGSERVER_IMAGE: cli:0.0.0-dev
          E2E_CLI_BIN: ${{ runner.temp }}/clibin/result/bin/cli
          # Pin the engine tag to the locally built image rather than the
          # schema default, which points at a released version.
          E2E_ENGINE_VERSION: 0.0.0-dev
          # Scratch project lives under RUNNER_TEMP so docker can bind-mount it.
          E2E_WORKDIR: ${{ runner.temp }}
          GOEXPERIMENT: jsonv2
        run: |
          nix develop .#cli --command \
            go test -tags e2e -timeout 30m -v ./cli/e2e/

      - name: "Store Nix cache"
        uses: ./.github/actions/cache-nix
        with:
          NIX_CACHE_PRIV_KEY: ${{ secrets.NIX_CACHE_PRIV_KEY }}
          NIX_CACHE_ACCESS_KEY_ID: ${{ secrets.NIX_CACHE_ACCESS_KEY_ID }}
          NIX_CACHE_SECRET_ACCESS_KEY: ${{ secrets.NIX_CACHE_SECRET_ACCESS_KEY }}
        if: always()
