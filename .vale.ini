# Repository Markdown: READMEs, contributor guides, service docs and the
# agent instructions, everything tools/vale/lint_markdown.sh selects. The docs
# site and the blog lint through docs/.vale.ini and landing/.vale.ini, which
# Vale finds first because it looks in the working directory before its
# parents; the three configs share one styles tree.
StylesPath = .vale/styles
MinAlertLevel = warning

Vocab = Nhost

[formats]
mdx = md

# Copied verbatim from docs/.vale.ini, so the three configs parse MDX alike;
# keep them in step. Plain Markdown rarely has these constructs, but an
# uppercase placeholder written as a tag (`<PROJECT_ID>`) is dropped by the
# fourth, which is what it should be.
[*.{md,mdx}]
TokenIgnores = (?m)^(import\s[^\n]*?['"][^'"\n]+['"];?)$, \
  (?sm)^(export const \w+) = \{\n(?:[ \t]+[^\n]*\n|\n)*\};?$, \
  (\{/\*)(?s:.*?)\*/\}, \
  (</?[A-Z][\w.]*)(?:\s[^<>]*)?/?>
BasedOnStyles = Vale, Nhost
Vale.Spelling = NO
Vale.Terms = warning
Vale.Repetition = warning
Vale.Avoid = error

# Docs-site rules: callout components and dashboard walkthroughs exist only
# on the docs site, so these say nothing useful about a README.
Nhost.Aside = NO
Nhost.NavPaths = NO
Nhost.UIPathArrow = NO
Nhost.RawDashboardURL = NO
Nhost.DeepLinkRel = NO
