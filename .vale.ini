# Repository Markdown, as selected by .vale/lint_markdown.sh. The docs and
# the blog use docs/.vale.ini and landing/.vale.ini.
StylesPath = .vale/styles
MinAlertLevel = warning

Vocab = Nhost

[formats]
mdx = md

# Same TokenIgnores as docs/.vale.ini; keep in step.
[*.{md,mdx}]
TokenIgnores = (?m)^(import\s[^\n]*?['"][^'"\n]+['"];?)$, \
  (?sm)^(export const \w+) = \{\n(?:[ \t]+[^\n]*\n|\n)*\};?$, \
  (\{/\*)(?s:.*?)\*/\}, \
  (</?[A-Z][\w.]*)(?:\s[^<>]*)?/?>
BasedOnStyles = Vale, Nhost
Vale.Spelling = NO
Vale.Terms = warning
Vale.Repetition = warning
Vale.Avoid = error

# Docs-site rules.
Nhost.Aside = NO
Nhost.NavPaths = NO
Nhost.UIPathArrow = NO
Nhost.RawDashboardURL = NO
Nhost.DeepLinkRel = NO
