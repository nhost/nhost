# Illustrative example: run auth + storage + graphql in ONE engine
# process, behind ONE port, with Postgres, Hasura, and MinIO as backing
# services.
#
# This file demonstrates the engine's unified NHOST_* configuration and is a
# starting point, not a turnkey production stack — it has not been
# integration-tested as part of the repo's checks, email/SMS and other
# provider-specific settings are omitted, and secrets are dev placeholders.
#
# What it shows:
#   * The genuinely shared settings are set ONCE as bare env vars on the engine
#     container: admin secret, JWT secret, CORS origins, and the app +
#     migrations database URLs. They fill every service that consumes them
#     (e.g. DATABASE_URL becomes auth's postgres and constellation's metadata
#     store; MIGRATIONS_DATABASE_URL becomes auth's and storage's migrations DB).
#   * Settings that legitimately differ per service stay per-service, via each
#     service's own native env vars: storage's S3_*/HASURA_ENDPOINT and
#     constellation's CONSTELLATION_HASURA_UPSTREAM_URL.
#   * Per-service precedence still holds: had any of these services set its own
#     admin-secret/jwt env var, that value would win over the shared one.
#
# Build and load the engine image first. The image builds as a nix2container
# `dir:`-format directory (not a docker-archive tarball), so `docker load` does
# not apply; load it with skopeo, which also tags it directly to match the
# image: field below:
#   nix build .#engine-docker-image
#   nix develop .#skopeo -c \
#     skopeo copy --insecure-policy dir:./result docker-daemon:engine:0.0.0-dev
#   # equivalently: cd services/engine && make build-docker-image
#
# Routes once up (engine bound to :4000):
#   http://localhost:4000/auth/v1/...     http://localhost:4000/storage/v1/...
#   http://localhost:4000/graphql/v1      http://localhost:4000/healthz

x-admin-secret: &admin-secret nhost-admin-secret
x-jwt-secret: &jwt-secret >-
  {"type":"HS256","key":"5152fa850c02dc222631cca898ed1485821a70912a6e3649c49076912daa3b62182ba013315915d64f40cddfbb8b58eb5bd11ba225336a6af45bbae07ca873f3"}
x-postgres-url: &postgres-url postgres://postgres:hejsan@postgres:5432/postgres?sslmode=disable

services:
  engine:
    container_name: engine
    image: engine:0.0.0-dev
    depends_on:
      graphql-engine:
        condition: service_started
      minio:
        condition: service_started
      # auth and storage migrate into the "auth"/"storage" schemas, which
      # golang-migrate expects to already exist; create them first.
      createschemas:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - '4000:4000'
    # The engine image does not (yet) bundle auth's email templates, and auth
    # loads them from the filesystem (default /app/email-templates). Mount the
    # in-repo copy so auth can start. A production image should ship these.
    volumes:
      - ../../../../auth/email-templates:/app/email-templates:ro
    # Entrypoint is `engine`; these are its arguments. `serve` runs all
    # three services by default (add --disable-<service> to drop one); every
    # other setting is supplied via the env vars below.
    command:
      - serve
      - --bind
      - ':4000'
      - --debug
    environment:
      # ---- shared (bare env): set once, fills every service that uses it ----
      ADMIN_SECRET: *admin-secret
      JWT_SECRET: *jwt-secret
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # app DB -> auth's postgres + constellation's metadata store;
      # migrations DB -> auth's + storage's migrations. One instance here.
      DATABASE_URL: *postgres-url
      MIGRATIONS_DATABASE_URL: *postgres-url

      # ---- auth: per-service (AUTH_*) ----
      # Serve auth under /v1 so, behind the engine's /auth prefix, routes match
      # the documented /auth/v1/... surface (auth defaults to no prefix).
      AUTH_API_PREFIX: /v1
      AUTH_SERVER_URL: http://localhost:4000/auth
      AUTH_CLIENT_URL: http://localhost:3000
      # Required by auth: hex-encoded 32-byte key. Dev placeholder only.
      AUTH_ENCRYPTION_KEY: 5152fa850c02dc222631cca898ed1485821a70912a6e3649c49076912daa3b62
      # Where auth applies its Hasura metadata (it rewrites /v1/graphql
      # -> /v1/metadata). The admin secret comes from the shared ADMIN_SECRET.
      HASURA_GRAPHQL_GRAPHQL_URL: http://graphql-engine:8080/v1/graphql

      # ---- storage: per-service (unprefixed env) ----
      HASURA_METADATA: '1'
      HASURA_ENDPOINT: http://graphql-engine:8080/v1
      POSTGRES_MIGRATIONS: '1'
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-5a7bdb5f42c41e0622bf61d6e08d5537}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-9e1c40c65a615a5b52f52aeeaf549944ec53acb1dff4a0bf01fb58e969f915c8}
      S3_BUCKET: default
      S3_ROOT_FOLDER: f215cf48-7458-4596-9aa5-2159fc6a3caf

      # ---- graphql (constellation): per-service (CONSTELLATION_*) ----
      CONSTELLATION_HASURA_UPSTREAM_URL: http://graphql-engine:8080
      CONSTELLATION_DEV_MODE: 'true'
      # The Hasura metadata defines its "default" DB source as
      # {from_env: HASURA_GRAPHQL_DATABASE_URL}. Constellation resolves that env
      # var in its own process to connect and introspect; without it the source
      # is dropped as inconsistent and no role gets a schema.
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:hejsan@postgres:5432/postgres

  postgres:
    container_name: engine-postgres
    image: postgres:13
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: hejsan

  graphql-engine:
    container_name: engine-graphql
    image: nhost/graphql-engine:v2.25.1-ce
    depends_on:
      - postgres
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:hejsan@postgres:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_ADMIN_SECRET: *admin-secret
      HASURA_GRAPHQL_JWT_SECRET: *jwt-secret
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
      HASURA_GRAPHQL_DEV_MODE: 'true'

  minio:
    container_name: engine-minio
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-5a7bdb5f42c41e0622bf61d6e08d5537}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-9e1c40c65a615a5b52f52aeeaf549944ec53acb1dff4a0bf01fb58e969f915c8}
    command: server --address 0.0.0.0:9000 --console-address 0.0.0.0:32765 /data
    ports:
      - '9000:9000'
      - '32765:32765'

  # Create the storage bucket once MinIO is up.
  # Create the auth/storage schemas once Postgres is up. Vanilla postgres:13
  # (unlike nhost's own image) ships neither, and golang-migrate creates its
  # schema_migrations table inside them rather than creating the schema.
  createschemas:
    container_name: engine-createschemas
    image: postgres:13
    depends_on:
      - postgres
    restart: on-failure
    entrypoint: >-
      /bin/sh -c "
      until psql 'postgres://postgres:hejsan@postgres:5432/postgres?sslmode=disable' -c 'CREATE SCHEMA IF NOT EXISTS auth; CREATE SCHEMA IF NOT EXISTS storage;'; do sleep 1; done;
      "

  createbuckets:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "
      until mc alias set nhost http://minio:9000
        ${S3_ACCESS_KEY:-5a7bdb5f42c41e0622bf61d6e08d5537}
        ${S3_SECRET_KEY:-9e1c40c65a615a5b52f52aeeaf549944ec53acb1dff4a0bf01fb58e969f915c8};
      do sleep 1; done;
      mc mb --ignore-existing nhost/default;
      "
