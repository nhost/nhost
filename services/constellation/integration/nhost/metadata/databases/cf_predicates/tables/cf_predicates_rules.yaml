table:
  name: rules
  schema: cf_predicates
computed_fields:
  - name: rule_visible
    definition:
      function:
        name: rule_visible
        schema: cf_predicates
insert_permissions:
  - role: cf_predicate_guard
    permission:
      check:
        rule_visible:
          _eq: true
      columns:
        - id
        - owner_id
        - label
select_permissions:
  - role: cf_no_grant
    permission:
      columns:
        - id
        - label
      filter: {}
  - role: cf_predicate_guard
    permission:
      columns:
        - id
        - label
      filter:
        rule_visible:
          _eq: true
  - role: cf_reader
    permission:
      columns:
        - id
        - owner_id
        - label
      computed_fields:
        - rule_visible
      filter: {}
