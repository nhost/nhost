          name: child
        column_mapping:
          id: parent_id
  - name: rel_arr_00000
    using:
      manual_configuration:
        remote_table:
          schema: cf_insert_order
          name: child
        column_mapping:
          id: parent_id
  - name: rel_arr_02120
    using:
      manual_configuration:
        remote_table:
          schema: cf_insert_order
          name: child
        column_mapping:
          id: parent_id
  - name: arr_mmmmmmmmmmmmmmmmmmmmmmmmmmmmmm_00000
    using:
