  name: parent
object_relationships:
  # Metadata and GraphQL input orders deliberately differ from the XXH3 order.
  - name: obj_rel_0000
    using:
      foreign_key_constraint_on:
        table:
          schema: cf_insert_order
          name: after_0
        column: parent_id
  - name: obj_rel_0001
    using:
      foreign_key_constraint_on: before_id
  - name: obj_rel_0224
    using:
      foreign_key_constraint_on:
        table:
          schema: cf_insert_order
          name: after_1
        column: parent_id
