version: "2"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "auth_schema_dump.sql"
    database:
      uri: postgresql://postgres:postgres@localhost:5432/local
    gen:
      go:
        package: "sql"
        out: "."
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # CTE/UNION projections retain the domain type but lose table-column
          # lineage, so override the nullable domain rather than individual columns.
          - db_type: "auth.email"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Text"
          - column: auth.refresh_tokens.type
            go_type:
              type: "RefreshTokenType"
          - column: auth.oauth2_clients.type
            go_type:
              type: "OAuth2ClientType"
