# TLS front for the isolated OIDC Auth instance.
#
# The generic OIDC provider requires an HTTPS AUTH_SERVER_URL so the browser
# callback base and the registered redirect URI are HTTPS. Auth itself speaks
# plain HTTP, so this nginx terminates TLS (with a committed test certificate)
# and proxies to the auth-oidc container. The certificate's SAN matches the
# static IP 10.233.0.11 assigned in docker-compose.yaml.
events {
    worker_connections 1024;
}

http {
    # Preserve the original Host/scheme so Auth builds absolute callback and
    # redirect URLs that match AUTH_SERVER_URL.
    server {
        listen 443 ssl;
        server_name auth-oidc;

        ssl_certificate /certs/auth.crt;
        ssl_certificate_key /certs/auth.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://auth-oidc:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            # State and discovery payloads can exceed the default header budget.
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
        }
    }
}
