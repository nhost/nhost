# typos settings for .vale/spellcheck.sh, which runs typos over tracked
# Markdown. typos flags known misspellings only, so unlike Vale.Spelling it
# does not trip over code identifiers and product names. Add a word here only
# when it is correct in context, never to silence a real typo.

[files]
extend-exclude = [
  # Generated by git-cliff from commit messages; short hashes read as typos.
  "CHANGELOG.md",
  # Third-party text.
  "vendor/",
]

[default]
extend-ignore-re = [
  # Base64 lines, such as a JWT wrapped across lines in a blog post.
  "(?m)^[A-Za-z0-9+/=_.-]{40,}$",
  # Message IDs in API responses.
  "\\bmsg_[A-Za-z0-9]+",
]

[default.extend-words]
# Hasura's `_nin` (not in) operator.
nin = "nin"

[default.extend-identifiers]
OTPs = "OTPs"
