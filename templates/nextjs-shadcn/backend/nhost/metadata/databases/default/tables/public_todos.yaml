table:
  name: todos
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: file
    using:
      foreign_key_constraint_on: file_id
insert_permissions:
  # Owning the row is not enough: `file_id` points at a row in `storage.files`
  # that this table's `public` rule then makes readable, so a row you own
  # pointed at a file you do not own is how somebody else's private attachment
  # gets published. The file half is the same check on insert and on update,
  # because either one can be the step that attaches it.
  - role: user
    permission:
      check:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _or:
              - file_id:
                  _is_null: true
              - file:
                  uploaded_by_user_id:
                    _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - title
        - completed
        - location
        - preposition
        - is_public
        - sort_order
        - file_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - title
        - completed
        - location
        - preposition
        - is_public
        - sort_order
        - file_id
        - created_at
        - user_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
  # Anyone, signed in or not, and it takes both switches: the row is flagged
  # shared, and its owner has published their profile. Unpublishing the profile
  # therefore takes the rows back too, rather than only hiding the page while
  # the API still answers for them. The owner half is the same condition as the
  # `public` rule in `auth_users.yaml`, reached here through the relationship.
  #
  # `user_id` is off the column list because a shared list has no use for it,
  # and the columns a role cannot read are the ones it cannot leak.
  - role: public
    permission:
      columns:
        - id
        - title
        - completed
        - location
        - preposition
        - sort_order
        - file_id
        - created_at
      filter:
        is_public:
          _eq: true
        user:
          metadata:
            _contains:
              publicProfile: true
          _not:
            metadata:
              _has_key: deletedAt
update_permissions:
  - role: user
    permission:
      columns:
        - title
        - completed
        - location
        - preposition
        - is_public
        - sort_order
        - file_id
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - _or:
              - file_id:
                  _is_null: true
              - file:
                  uploaded_by_user_id:
                    _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
