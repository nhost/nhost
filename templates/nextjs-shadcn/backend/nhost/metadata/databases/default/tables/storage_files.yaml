table:
  name: files
  schema: storage
configuration:
  column_config:
    bucket_id:
      custom_name: bucketId
    created_at:
      custom_name: createdAt
    is_uploaded:
      custom_name: isUploaded
    mime_type:
      custom_name: mimeType
    updated_at:
      custom_name: updatedAt
    uploaded_by_user_id:
      custom_name: uploadedByUserId
  custom_column_names:
    bucket_id: bucketId
    created_at: createdAt
    is_uploaded: isUploaded
    mime_type: mimeType
    updated_at: updatedAt
    uploaded_by_user_id: uploadedByUserId
  custom_name: files
  custom_root_fields:
    delete: deleteFiles
    delete_by_pk: deleteFile
    insert: insertFiles
    insert_one: insertFile
    select: files
    select_aggregate: filesAggregate
    select_by_pk: file
    update: updateFiles
    update_by_pk: updateFile
object_relationships:
  - name: bucket
    using:
      foreign_key_constraint_on: bucket_id
array_relationships:
  # The reverse of `todos.file_id`. Nothing queries files -> todos from the
  # app; it exists so the permissions below can ask "is the item holding this
  # file public?" without that answer living on the file itself.
  - name: todos
    using:
      foreign_key_constraint_on:
        column: file_id
        table:
          name: todos
          schema: public
insert_permissions:
  # Uploads go straight from the browser with the user's own token. The avatars
  # bucket is deliberately not here: those writes go through a function with
  # the admin secret because it resizes the image first, and letting the
  # browser write that bucket directly would let it skip the resize.
  - role: user
    permission:
      check:
        bucket_id:
          _eq: todo-attachments
      set:
        uploaded_by_user_id: X-Hasura-User-Id
      columns:
        - bucket_id
        - etag
        - id
        - is_uploaded
        - metadata
        - mime_type
        - name
        - size
        - uploaded_by_user_id
select_permissions:
  # An attachment is readable by anyone exactly when the item pointing at it is
  # readable by anyone, so this repeats the condition in `public_todos.yaml`
  # rather than trusting that table's permission: a relationship filter matches
  # raw rows, it does not apply the related table's own rule.
  #
  # This is the one that fails dangerously. Widen it and every private
  # attachment in the project becomes world-readable at once. There is a
  # scripted check for it in the README.
  - role: public
    permission:
      columns:
        - bucket_id
        - created_at
        - etag
        - id
        - is_uploaded
        - metadata
        - mime_type
        - name
        - size
        - updated_at
        - uploaded_by_user_id
      # `file(id:)` and nothing else. Storage answers every `<img>` as `public`
      # and looks the row up by id, so that is all this role needs, and it is
      # the difference between "anyone can fetch this avatar" and "anyone can
      # list every avatar". An avatar's file id is its owner's user id, so the
      # list form is a dump of the user table. The columns stay as they are:
      # storage's own metadata query selects all of them and the download fails
      # outright if the role cannot read one.
      query_root_fields:
        - select_by_pk
      subscription_root_fields:
        - select_by_pk
      filter:
        _or:
          - bucket_id:
              _eq: avatars
          - todos:
              is_public:
                _eq: true
              user:
                metadata:
                  _contains:
                    publicProfile: true
                _not:
                  metadata:
                    _has_key: deletedAt
  - role: user
    permission:
      columns:
        - bucket_id
        - created_at
        - etag
        - id
        - is_uploaded
        - metadata
        - mime_type
        - name
        - size
        - updated_at
        - uploaded_by_user_id
      # Restricted for the same reason as `public`. The avatars arm below
      # matches every avatar, so leaving `files` reachable would let anyone who
      # can sign up list them, and a list of avatars is a list of user ids.
      # Being signed in is not a reason to hand over the user table. `file(id:)`
      # still answers the `<img>` lookups, and the mutation roots are untouched,
      # so upload and delete keep working.
      query_root_fields:
        - select_by_pk
      subscription_root_fields:
        - select_by_pk
      filter:
        _or:
          - bucket_id:
              _eq: avatars
          - uploaded_by_user_id:
              _eq: X-Hasura-User-Id
          # The same owner conditions as the `public` arm. Without them a
          # signed-in visitor keeps reading an attachment after its owner
          # unpublished or soft-deleted, and unpublishing is meant to retract
          # everything rather than only what strangers could see.
          - todos:
              is_public:
                _eq: true
              user:
                metadata:
                  _contains:
                    publicProfile: true
                _not:
                  metadata:
                    _has_key: deletedAt
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - bucket_id:
              _eq: todo-attachments
          - uploaded_by_user_id:
              _eq: X-Hasura-User-Id
