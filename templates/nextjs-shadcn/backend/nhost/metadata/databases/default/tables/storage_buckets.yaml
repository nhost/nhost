table:
  name: buckets
  schema: storage
configuration:
  column_config:
    cache_control:
      custom_name: cacheControl
    created_at:
      custom_name: createdAt
    download_expiration:
      custom_name: downloadExpiration
    max_upload_file_size:
      custom_name: maxUploadFileSize
    min_upload_file_size:
      custom_name: minUploadFileSize
    presigned_urls_enabled:
      custom_name: presignedUrlsEnabled
    updated_at:
      custom_name: updatedAt
  custom_column_names:
    cache_control: cacheControl
    created_at: createdAt
    download_expiration: downloadExpiration
    max_upload_file_size: maxUploadFileSize
    min_upload_file_size: minUploadFileSize
    presigned_urls_enabled: presignedUrlsEnabled
    updated_at: updatedAt
  custom_name: buckets
  custom_root_fields:
    delete: deleteBuckets
    delete_by_pk: deleteBucket
    insert: insertBuckets
    insert_one: insertBucket
    select: buckets
    select_aggregate: bucketsAggregate
    select_by_pk: bucket
    update: updateBuckets
    update_by_pk: updateBucket
array_relationships:
  # hasura-storage owns this relationship and recreates it on every start with
  # the admin secret, so removing it from this file does not remove it from the
  # running backend. It is listed here only so the checked-in metadata matches
  # what the server converges to. It is harmless because neither `public` nor
  # `user` has a select permission on this table below: with no bucket select
  # permission the `bucket`/`buckets` roots and any `bucket { files }` traversal
  # are unreachable for those roles, so the relationship cannot be used to walk
  # around the root-field restriction in `storage_files.yaml`.
  - name: files
    using:
      foreign_key_constraint_on:
        column: bucket_id
        table:
          name: files
          schema: storage
# There is deliberately no `public` or `user` select permission on this table.
# The template frontend never queries buckets, and hasura-storage reads bucket
# metadata with the admin secret on both the download path
# (`get_file_metadata_headers.go`) and the upload path (`upload_files.go`), so
# admin-only select breaks neither the frontend nor storage. Do not add a
# `public`/`user` select permission back: an avatar's file id is its owner's
# user id, and any bucket read for those roles reopens `bucket { files }` as a
# full dump of the avatars bucket regardless of the root-field restriction in
# `storage_files.yaml`.
