# The storage service tracks this table and names its fields itself, and it
# inserts the row for an upload through Hasura as the uploading user, so the
# insert permission is what decides who may upload and where. The row is
# finished (size, etag, uploaded) by the service as admin, which is why there
# is no update permission here. Select and delete are the user's own files.
# The service also reads a file back as the user before serving it and asks
# for every select column, so dropping one breaks downloads.
table:
  name: files
  schema: storage
configuration:
  column_config:
    bucket_id:
      custom_name: bucketId
    created_at:
      custom_name: createdAt
    etag:
      custom_name: etag
    id:
      custom_name: id
    is_uploaded:
      custom_name: isUploaded
    metadata:
      custom_name: metadata
    mime_type:
      custom_name: mimeType
    name:
      custom_name: name
    size:
      custom_name: size
    updated_at:
      custom_name: updatedAt
    uploaded_by_user_id:
      custom_name: uploadedByUserId
  custom_column_names:
    bucket_id: bucketId
    created_at: createdAt
    etag: etag
    id: id
    is_uploaded: isUploaded
    metadata: metadata
    mime_type: mimeType
    name: name
    size: size
    updated_at: updatedAt
    uploaded_by_user_id: uploadedByUserId
  custom_name: files
  custom_root_fields:
    delete: deleteFiles
    delete_by_pk: deleteFile
    insert: insertFiles
    insert_one: insertFile
    select: files
    select_aggregate: filesAggregate
    select_by_pk: file
    update: updateFiles
    update_by_pk: updateFile
insert_permissions:
  - role: user
    permission:
      check:
        bucket_id:
          _eq: default
      set:
        uploaded_by_user_id: X-Hasura-User-Id
      columns:
        - id
        - bucket_id
        - name
        - size
        - mime_type
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - created_at
        - updated_at
        - bucket_id
        - name
        - size
        - mime_type
        - etag
        - is_uploaded
        - uploaded_by_user_id
        - metadata
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        uploaded_by_user_id:
          _eq: X-Hasura-User-Id
