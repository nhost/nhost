# The auth service tracks this table and names its fields itself when it
# starts; nhost up re-applies that after this file. What it never adds is a
# permission, and without one a signed-in user can register a passkey but not
# list or remove it. Both are scoped to the user's own rows.
table:
  name: user_security_keys
  schema: auth
configuration:
  column_config:
    credential_id:
      custom_name: credentialId
    credential_public_key:
      custom_name: credentialPublicKey
    id:
      custom_name: id
    user_id:
      custom_name: userId
  custom_column_names:
    credential_id: credentialId
    credential_public_key: credentialPublicKey
    id: id
    user_id: userId
  custom_name: authUserSecurityKeys
  custom_root_fields:
    delete: deleteAuthUserSecurityKeys
    delete_by_pk: deleteAuthUserSecurityKey
    insert: insertAuthUserSecurityKeys
    insert_one: insertAuthUserSecurityKey
    select: authUserSecurityKeys
    select_aggregate: authUserSecurityKeysAggregate
    select_by_pk: authUserSecurityKey
    update: updateAuthUserSecurityKeys
    update_by_pk: updateAuthUserSecurityKey
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - credential_id
        - nickname
      filter:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
