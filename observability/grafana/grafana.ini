[analytics]
check_for_updates = false
[grafana_net]
url = https://grafana.net
[log]
mode = console
[paths]
data = /var/lib/grafana/
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /var/lib/grafana/provisioning
[server]
domain = ''
root_url = '{{ .RootURL }}'

{{ if .SMTP }}
[smtp]
enabled=true
host={{ .SMTP.Host }}:{{ .SMTP.Port }}
user={{ .SMTP.User }}
password={{ .SMTP.Password }}
from_address={{ .SMTP.Sender }}
{{ end }}
[users]
allow_sign_up = false
[auth]
disable_login_form = true
[auth.generic_oauth]
name = Nhost
enabled = true
client_id = {{ .RootURL }}/public/oauth-client.json
auth_url = {{ .AuthURL }}/oauth2/authorize
token_url = {{ .AuthURL }}/oauth2/token
api_url = {{ .AuthURL }}/oauth2/userinfo
use_pkce = true
allow_sign_up = true
scopes = openid email profile graphql
groups_attribute_path = "https://hasura.io/jwt/claims"."x-hasura-organization-ids"
allowed_groups = {{ .OrganizationID }}
org_mapping = *:1:{{ .Role }}
