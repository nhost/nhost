# The styles tree is shared with the docs, which lint through docs/.vale.ini
# against the same path.
StylesPath = ../.vale/styles
MinAlertLevel = warning

Vocab = Nhost

[formats]
mdx = md

# Vale matches ignore patterns against the file extension, not the path, so
# they need an extension-only section. Copied verbatim from docs/.vale.ini,
# because blog MDX uses the same constructs; keep the two in step. Each
# pattern keeps only a one-line capture: Vale drops lint on paragraphs next to
# multi-line inline code. Patterns also run inside code fences, so they must
# stay harmless there.
#   1. top-level `import ... from '...'` lines
#   2. `export const name = { ... };` blocks whose body lines are indented or
#      blank, which on the blog is the `export const article` frontmatter
#   3. `{/* ... */}` comments; rules that must see them use `scope: raw`
#   4. JSX tags (`<Image>`, `<a href="...">`), attributes included
[*.{md,mdx}]
TokenIgnores = (?m)^(import\s[^\n]*?['"][^'"\n]+['"];?)$, \
  (?sm)^(export const \w+) = \{\n(?:[ \t]+[^\n]*\n|\n)*\};?$, \
  (\{/\*)(?s:.*?)\*/\}, \
  (</?[A-Z][\w.]*)(?:\s[^<>]*)?/?>

# Severities follow the tiers in .vale/styles/README.md, measured over the
# blog corpus rather than the docs tree. A shared Nhost rule is only ever
# relaxed here, never promoted, so "error" means the same thing in both
# configs; the blog-specific NhostBlog rules carry their own tier.
[src/pages/blog/**/*.{md,mdx}]
BasedOnStyles = Vale, Nhost, NhostBlog
Vale.Spelling = NO
Vale.Terms = warning
Vale.Repetition = warning
Vale.Avoid = error

# Docs-only rules, each about a docs-site convention the blog does not share:
# the blog has no ':::' callout (NhostBlog.Callout says so instead), no
# dashboard walkthroughs, and its new-tab links are covered more widely by
# NhostBlog.NewTabRel.
Nhost.Aside = NO
Nhost.NavPaths = NO
Nhost.UIPathArrow = NO
Nhost.RawDashboardURL = NO
Nhost.DeepLinkRel = NO

# Relaxed from the error tier they carry for the docs, because the blog corpus
# is not yet at zero. Promote each back by deleting its line once the count is
# zero, as the README table records.
Nhost.LLMPhrasesStrict = warning
Nhost.Spacing = warning
