StylesPath = ../.vale/styles
MinAlertLevel = warning

Vocab = Nhost

[formats]
mdx = md

# Same TokenIgnores as docs/.vale.ini; keep in step.
[*.{md,mdx}]
TokenIgnores = (?m)^(import\s[^\n]*?['"][^'"\n]+['"];?)$, \
  (?sm)^(export const \w+) = \{\n(?:[ \t]+[^\n]*\n|\n)*\};?$, \
  (\{/\*)(?s:.*?)\*/\}, \
  (</?[A-Z][\w.]*)(?:\s[^<>]*)?/?>

# Tiers: .vale/styles/README.md. Shared rules are only relaxed here, never
# promoted.
[src/pages/blog/**/*.{md,mdx}]
BasedOnStyles = Vale, Nhost, NhostBlog
Vale.Spelling = NO
Vale.Terms = warning
Vale.Repetition = warning
Vale.Avoid = error

# Docs-only rules.
Nhost.Aside = NO
Nhost.NavPaths = NO
Nhost.UIPathArrow = NO
Nhost.RawDashboardURL = NO
Nhost.DeepLinkRel = NO

# Not yet at zero on the blog; delete a line to promote it back.
Nhost.LLMPhrasesStrict = warning
Nhost.Spacing = warning
