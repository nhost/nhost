name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OpenAI directory rules and manifest consistency
        run: node scripts/check-plugin.mjs
      - name: claude plugin validate
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json --strict
          npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/marketplace.json --strict
      - name: OpenAI skills-only archive
        run: |
          node scripts/build-openai-archive.mjs
          python3 scripts/verify-openai-archive.py dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openai-upload
          path: dist/nhost-openai-codex-format.zip

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --verbose --redact
