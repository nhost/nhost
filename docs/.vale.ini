StylesPath = ../.vale/styles
MinAlertLevel = warning

Vocab = Nhost

[formats]
mdx = md

# TokenIgnores need an extension-only section and also apply inside code
# fences. Keep captures single-line: Vale skips paragraphs next to multi-line
# inline code. In order: imports; `export const x = {...}` blocks (indented
# body, so a match can't run past a fence); `{/* */}` comments; JSX tags.
[*.{md,mdx}]
TokenIgnores = (?m)^(import\s[^\n]*?['"][^'"\n]+['"];?)$, \
  (?sm)^(export const \w+) = \{\n(?:[ \t]+[^\n]*\n|\n)*\};?$, \
  (\{/\*)(?s:.*?)\*/\}, \
  (</?[A-Z][\w.]*)(?:\s[^<>]*)?/?>

# Tiers: .vale/styles/README.md.
[src/content/docs/**/*.{md,mdx}]
BasedOnStyles = Vale, Nhost
Vale.Spelling = NO
Vale.Terms = warning
Vale.Repetition = warning
Vale.Avoid = error

# Generated pages. Checks set by name above must be turned off by name.
[src/content/docs/{reference/javascript/**,reference/cli/**,reference/deprecated/**,reference/configuration/**,products/database/extensions.mdx}]
BasedOnStyles =
Vale.Terms = NO
Vale.Repetition = NO
Vale.Avoid = NO
