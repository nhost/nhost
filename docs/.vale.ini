# The styles tree is shared with the blog, which lints through
# landing/.vale.ini against the same path.
StylesPath = ../.vale/styles
MinAlertLevel = warning

Vocab = Nhost

[formats]
mdx = md

# Vale matches ignore patterns against the file extension, not the path, so
# they need an extension-only section. Each pattern keeps only a one-line
# capture: Vale drops lint on paragraphs next to multi-line inline code.
# Patterns also run inside code fences, so they must stay harmless there.
#   1. top-level `import ... from '...'` lines
#   2. `export const name = { ... };` blocks whose body lines are indented or
#      blank, so a match cannot run past a fence closed by `} as const;`
#   3. `{/* ... */}` comments; rules that must see them use `scope: raw`
#   4. JSX tags (`<Steps>`, `<TabItem label="...">`, `</Tabs>`), attributes
#      included; a fence directly under a tag then parses as code
[*.{md,mdx}]
TokenIgnores = (?m)^(import\s[^\n]*?['"][^'"\n]+['"];?)$, \
  (?sm)^(export const \w+) = \{\n(?:[ \t]+[^\n]*\n|\n)*\};?$, \
  (\{/\*)(?s:.*?)\*/\}, \
  (</?[A-Z][\w.]*)(?:\s[^<>]*)?/?>

# Severities follow the tiers in .vale/styles/README.md.
[src/content/docs/**/*.{md,mdx}]
BasedOnStyles = Vale, Nhost
Vale.Spelling = NO
Vale.Terms = warning
Vale.Repetition = warning
Vale.Avoid = error

# Generated pages, which are not written by hand. A check
# set by name above stays on unless it is turned off here as well.
[src/content/docs/{reference/javascript/**,reference/cli/**,reference/deprecated/**,reference/configuration/**,products/database/extensions.mdx}]
BasedOnStyles =
Vale.Terms = NO
Vale.Repetition = NO
Vale.Avoid = NO
